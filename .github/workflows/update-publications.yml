name: Update Publications

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scholarly

      - name: Refresh publications from Google Scholar
        env:
          SCHOLAR_USER_ID: jVJaA-QAAAAJ
        run: python scripts/update_publications.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/publications.json assets/data/publications.js
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "chore: update publications from Google Scholar"
            git push
          fi
